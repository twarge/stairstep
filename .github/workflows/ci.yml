name: CI

# Compile-checks the macOS and iOS apps and runs the package tests on every
# push to main and on PRs.
#
# Notes / assumptions:
#   * Same runner image and Xcode as appstore.yml and the sibling app repos
#     (xcode-27, Xcode 27.1), so the OpenCascade tree CI caches was built by
#     the same toolchain that links it at release time. The runner must be Apple
#     Silicon — the OpenCascade build and the iOS simulator slice are
#     arm64-only.
#   * OpenCascade is not vendored as a binary (it's ~0.5 GB and git-ignored).
#     The occt-static action restores it from the Actions cache and builds it
#     from the OCCT/RapidJSON submodules only on a miss (an hour or more).
#     The key is shared with appstore.yml, so a push to main also warms the
#     tree a release tag will restore; occt-cache.yml keeps it from expiring
#     between pushes.
#   * This is a build-only check (no code signing, no iOS-device build, no App
#     Store export — those need signing credentials and live in appstore.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The xcode-27 image defaults to Xcode 27.0. Build with 27.1, the Xcode the
# app is developed on, so CI compiles against the same SDKs.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  build:
    name: Build & test (macOS + iOS Simulator)
    runs-on: xcode-27
    # Generous only for a cold OpenCascade cache; warm runs take minutes.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The xcode-27 image ships Xcode without its Metal Toolchain
      # (actions/runner-images#14548); RealityStepShaders.metal needs it.
      - name: Install the Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: OpenCascade static build
        uses: ./.github/actions/occt-static

      - name: Swift package build
        run: swift build

      - name: Swift package tests
        run: swift test

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project Stairstep.xcodeproj \
            -scheme Stairstep \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Simulator app
        run: |
          xcodebuild build \
            -project Stairstep.xcodeproj \
            -scheme Stairstep \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
